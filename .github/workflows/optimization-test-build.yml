name: Optimization Branch Test Build

on:
  push:
    branches:
      - Optimization-Branch-Test
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Build
        run: ./gradlew build --no-daemon

      - name: Upload test JAR
        uses: actions/upload-artifact@v4
        with:
          name: archwood-good-optimization-test
          path: |
            build/libs/archwood_good-*.jar
            !build/libs/*-sources.jar
