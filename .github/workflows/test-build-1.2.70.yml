name: Test Build 1.2.70
on:
  push:
    branches:
      - 1.2.70-ancient-archwood-exclusion
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - run: chmod +x ./gradlew
      - run: ./gradlew build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: archwood-good-1.2.70-test
          path: build/libs/archwood_good-*.jar
          if-no-files-found: error
