name: Build and Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Build
        run: ./gradlew build --no-daemon

      - name: Read version
        id: version
        shell: bash
        run: echo "version=$(grep '^mod_version=' gradle.properties | cut -d= -f2)" >> "$GITHUB_OUTPUT"

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          JAR=$(find build/libs -maxdepth 1 -type f -name 'archwood_good-*.jar' ! -name '*-sources.jar' -print -quit)
          if [[ -z "$JAR" ]]; then
            echo "::error::No mod JAR found in build/libs"
            ls -lah build/libs
            exit 1
          fi

          echo "Built artifact: $JAR"
          echo "Looking for release $VERSION (or v$VERSION)..."

          if gh release view "$VERSION" >/dev/null; then
            RELEASE_TAG="$VERSION"
            echo "Found existing release: $RELEASE_TAG"
          elif gh release view "v$VERSION" >/dev/null; then
            RELEASE_TAG="v$VERSION"
            echo "Found existing release: $RELEASE_TAG"
          else
            RELEASE_TAG="$VERSION"
            echo "No existing release found. Creating $RELEASE_TAG..."
            gh release create "$RELEASE_TAG" "$JAR" \
              --title "Archwood Good $VERSION for Minecraft 1.21.1" \
              --generate-notes
            exit 0
          fi

          echo "Uploading $JAR to release $RELEASE_TAG..."
          gh release upload "$RELEASE_TAG" "$JAR" --clobber
          echo "Release upload completed successfully."
