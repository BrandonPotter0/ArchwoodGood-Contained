name: Build and Release

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Build
        run: ./gradlew build --no-daemon

      - name: Read version
        id: version
        shell: bash
        run: echo "version=$(grep '^mod_version=' gradle.properties | cut -d= -f2)" >> "$GITHUB_OUTPUT"

      - name: Validate built mod metadata
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          JAR=$(find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' -print -quit)
          if [[ -z "$JAR" ]]; then
            echo "::error::No mod JAR found in build/libs"
            ls -lah build/libs
            exit 1
          fi

          MOD_VERSION=$(unzip -p "$JAR" META-INF/neoforge.mods.toml | grep '^version=' | head -n 1 | cut -d '"' -f 2)
          echo "Built JAR: $JAR"
          echo "Release version: $VERSION"
          echo "Embedded mod version: $MOD_VERSION"

          if [[ ! "$MOD_VERSION" =~ ^[0-9]+([.][0-9]+)*([+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid embedded NeoForge mod version: '$MOD_VERSION'"
            exit 1
          fi

          if [[ "$MOD_VERSION" != "$VERSION" ]]; then
            echo "::error::Embedded mod version '$MOD_VERSION' does not match gradle.properties version '$VERSION'"
            exit 1
          fi

      - name: Create or update GitHub release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          # Match the built mod JAR regardless of archive name, capitalization, or spaces.
          JAR=$(find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' -print -quit)
          if [[ -z "$JAR" ]]; then
            echo "::error::No mod JAR found in build/libs"
            ls -lah build/libs
            exit 1
          fi

          echo "Built artifact: $JAR"
          echo "Looking for release $VERSION (or v$VERSION)..."

          if gh release view "$VERSION" >/dev/null; then
            RELEASE_TAG="$VERSION"
            echo "Found existing release: $RELEASE_TAG"
          elif gh release view "v$VERSION" >/dev/null; then
            RELEASE_TAG="v$VERSION"
            echo "Found existing release: $RELEASE_TAG"
          else
            RELEASE_TAG="$VERSION"
            echo "No existing release found. Creating $RELEASE_TAG..."
            gh release create "$RELEASE_TAG" "$JAR" \
              --title "Archwood Good $VERSION for Minecraft 1.21.1" \
              --generate-notes
            exit 0
          fi

          echo "Uploading $JAR to release $RELEASE_TAG..."
          gh release upload "$RELEASE_TAG" "$JAR" --clobber
          echo "Release upload completed successfully."
