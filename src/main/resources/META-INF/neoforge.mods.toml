# This is an example mods.toml file. It contains the data relating to the loading mods.
# There are several mandatory fields (#mandatory), and many more that are optional (#optional).
# The overall format is standard TOML format, v0.5.0.
# Note that there are a couple of TOML lists in this file.
# Find more information on toml format here:  https://github.com/neoforged/NeoForge
modLoader="javafml" #mandatory
loaderVersion="[4,)" #mandatory
issueTrackerURL="https://github.com/Alexthw46/ArchwoodGood/issues?q=sort%3Aupdated-desc+is%3Aissue+is%3Aopen" #optional

license="GNU Lesser General Public License v3.0"
[[mods]] #mandatory
modId="archwood_good" #mandatory
version="0.10.1" #mandatory
displayName="Archwood Good" #mandatory
#updateJSONURL="http://myurl.me/" #optional
#displayURL="http://example.com/" #optional
logoFile="logo.png" #optional
credits="The Floofy Poofy," #optional
authors="Alexthw, Xel'Bayria, TheFloofyPoofy" #optional
description='''
Added missing Wood Goods for WoodTypes from Ars Nouveau & Ars Elemental. Enhance the compatibility with Every Compat.
'''

[[dependencies.archwood_good]]
modId = "minecraft"
versionRange = "[1.21,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.archwood_good]]
modId = "ars_nouveau"
versionRange = "[1.21.1-5.4,)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.archwood_good]]
modId = "ars_elemental"
type = "optional"
reason = "Adds flashing archwood compat"
versionRange = "[0.7.0,)"
ordering="AFTER"
side="BOTH"

[[dependencies.archwood_good]]
modId="terrablender"
type="optional"
reason="Places the Dawning Forest biome in the overworld"
versionRange="[4.0,)"
ordering="AFTER"
side="BOTH"

[[dependencies.archwood_good]]
modId = "cloth_config"
type = "optional"
reason = "In-game config screen for Giant Archwood Trees"
versionRange = "*"
ordering = "NONE"
side = "CLIENT"
