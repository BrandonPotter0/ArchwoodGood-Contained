# This is an example mods.toml file. It contains the data relating to the mod loader.
modLoader="javafml"
loaderVersion="[4,)"
issueTrackerURL="https://github.com/Alexthw46/ArchwoodGood/issues?q=sort%3Aupdated-desc+is%3Aissue+is%3Aopen"

license="GNU Lesser General Public License v3.0"
[[mods]]
modId="archwood_good"
version="1.2.9"
displayName="Archwood Good"
logoFile="logo.png"
credits="The Floofy Poofy,"
authors="Alexthw, Xel'Bayria, TheFloofyPoofy"
description='''
Added missing Wood Goods for WoodTypes from Ars Nouveau & Ars Elemental. Enhance the compatibility with Every Compat.
'''
[[dependencies.archwood_good]]
modId = "minecraft"
versionRange = "[1.21,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.archwood_good]]
modId = "ars_nouveau"
versionRange = "[1.21.1-5.4,)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.archwood_good]]
modId = "ars_elemental"
versionRange = "[0.7.11.2,)"
ordering = "AFTER"
side = "BOTH"
[[dependencies.archwood_good]]
modId="terrablender"
type="optional"
reason="Places the Dawning Forest biome in the overworld"
versionRange="[4.0,)"
ordering="AFTER"
side="BOTH"

[[dependencies.archwood_good]]
modId = "cloth_config"
type = "optional"
reason = "In-game config screen for Giant Archwood Trees"
versionRange = "*"
ordering = "NONE"
side = "CLIENT"
[[mixins]]
config="archwood_good.mixins.json"
